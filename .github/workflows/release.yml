name: Release

on:
    push:
        tags: ["*.*.*"]

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-24.04
        permissions:
            attestations: write
            contents: write
            id-token: write
        steps:
            # Actions are pinned to commit SHAs: a tag can be moved to point at different code.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci

            - name: Verify the tag matches the manifest
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  manifest_version="$(node -p 'require("./manifest.json").version')"
                  if [ "$manifest_version" != "$TAG" ]; then
                    echo "manifest.json is $manifest_version but the tag is $TAG" >&2
                    exit 1
                  fi

            - run: npm run check

            - name: Attest the built artifacts
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  gh release create "$TAG" \
                    --title "$TAG" \
                    --draft \
                    --generate-notes \
                    dist/main.js dist/manifest.json dist/styles.css
